{% extends "base.html" %}
{% block title %}Categorías | La Canasta{% endblock %}
{% block content %}
<h2>Categorías del supermercado</h2>
<ul>
{% for categoria in categorias %}
  <li><a href="/?categoria={{ categoria.id }}">{{ categoria.nombre }}</a></li>
{% else %}
  <li>No hay categorías disponibles.</li>
{% endfor %}
</ul>
{% endblock %}
